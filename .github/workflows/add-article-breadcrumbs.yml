name: Add Reading Library Breadcrumbs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-article-breadcrumbs.yml'
      - 'scripts/add_article_breadcrumbs.py'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add breadcrumb schema to generator
        run: python scripts/add_article_breadcrumbs.py
      - name: Commit generator update
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/materialize_articles.py
          git commit -m "Add breadcrumb schema to Reading Library articles"
          git push
