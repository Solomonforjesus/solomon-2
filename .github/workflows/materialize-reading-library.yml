name: Materialize Reading Library Articles

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/materialize-reading-library.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install parser
        run: python -m pip install beautifulsoup4

      - name: Build static article pages
        run: python scripts/materialize_articles.py

      - name: Commit materialized articles
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain --untracked-files=all articles)" ]; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A articles vercel.json
          git commit -m "Materialize Reading Library as static HTML pages"
          git push
