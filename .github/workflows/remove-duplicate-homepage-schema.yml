name: Remove Duplicate Homepage Schema

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-duplicate-homepage-schema.yml'
      - 'scripts/remove_duplicate_homepage_schema.py'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate schema
        run: python scripts/remove_duplicate_homepage_schema.py
      - name: Commit cleanup
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reading-library.js
          git commit -m "Use static homepage entity schema as canonical"
          git push
