name: Improve Homepage SEO

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/improve-homepage-seo.yml'

permissions:
  contents: write

jobs:
  improve-homepage-seo:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add homepage SEO metadata and semantic H1
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old_title = '  <title>Solomon For Jesus</title>'
          new_head = '''  <title>Solomon For Jesus | Christian Answers, Prayer, Bible Study & Hope in Jesus Christ</title>
  <meta name="description" content="Solomon For Jesus is a free Christian resource offering biblical answers, prayer support, Bible study, Christian articles, and Gospel-centered hope in Jesus Christ." />
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
  <link rel="canonical" href="https://www.solomonforjesus.com/" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Solomon For Jesus" />
  <meta property="og:title" content="Solomon For Jesus | Wisdom, Truth, and Hope in Jesus Christ" />
  <meta property="og:description" content="A free Christian resource for biblical answers, prayer, Bible study, Christian articles, and Gospel-centered hope in Jesus Christ." />
  <meta property="og:url" content="https://www.solomonforjesus.com/" />
  <meta property="og:image" content="https://www.solomonforjesus.com/ChatGPT%20Image%20Jun%2027,%202026,%2011_30_33%20AM.png" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Solomon For Jesus | Wisdom, Truth, and Hope in Jesus Christ" />
  <meta name="twitter:description" content="A free Christian resource for biblical answers, prayer, Bible study, Christian articles, and Gospel-centered hope in Jesus Christ." />
  <meta name="twitter:image" content="https://www.solomonforjesus.com/ChatGPT%20Image%20Jun%2027,%202026,%2011_30_33%20AM.png" />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "WebSite",
        "@id": "https://www.solomonforjesus.com/#website",
        "url": "https://www.solomonforjesus.com/",
        "name": "Solomon For Jesus",
        "description": "A free Christian resource offering biblical answers, prayer support, Bible study, Christian articles, and Gospel-centered hope in Jesus Christ.",
        "inLanguage": "en"
      },
      {
        "@type": "Organization",
        "@id": "https://www.solomonforjesus.com/#organization",
        "name": "Solomon For Jesus",
        "url": "https://www.solomonforjesus.com/",
        "logo": "https://www.solomonforjesus.com/ChatGPT%20Image%20Jun%2027,%202026,%2011_30_33%20AM.png"
      }
    ]
  }
  </script>'''

          if old_title in text:
              text = text.replace(old_title, new_head, 1)

          body_marker = '<body>\n  <div class="page">'
          h1 = '''<body>\n  <h1 style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;">Solomon For Jesus — Christian Answers, Prayer, Bible Study, and Hope in Jesus Christ</h1>\n  <div class="page">'''
          if body_marker in text and 'Christian Answers, Prayer, Bible Study, and Hope in Jesus Christ</h1>' not in text:
              text = text.replace(body_marker, h1, 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit homepage SEO improvements
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Improve Solomon homepage SEO metadata"
          git push
