name: Improve Homepage SEO

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/improve-homepage-seo.yml

permissions:
  contents: write

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update homepage metadata
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          old = "  <title>Solomon For Jesus</title>"
          lines = [
              '  <title>Solomon For Jesus | Christian Answers, Prayer, Bible Study &amp; Hope in Jesus Christ</title>',
              '  <meta name="description" content="Solomon For Jesus is a free Christian resource offering biblical answers, prayer support, Bible study, Christian articles, and Gospel-centered hope in Jesus Christ." />',
              '  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />',
              '  <link rel="canonical" href="https://www.solomonforjesus.com/" />',
              '  <meta property="og:type" content="website" />',
              '  <meta property="og:site_name" content="Solomon For Jesus" />',
              '  <meta property="og:title" content="Solomon For Jesus | Wisdom, Truth, and Hope in Jesus Christ" />',
              '  <meta property="og:description" content="A free Christian resource for biblical answers, prayer, Bible study, Christian articles, and Gospel-centered hope in Jesus Christ." />',
              '  <meta property="og:url" content="https://www.solomonforjesus.com/" />',
              '  <meta property="og:image" content="https://www.solomonforjesus.com/ChatGPT%20Image%20Jun%2027,%202026,%2011_30_33%20AM.png" />',
              '  <meta name="twitter:card" content="summary_large_image" />',
              '  <meta name="twitter:title" content="Solomon For Jesus | Wisdom, Truth, and Hope in Jesus Christ" />',
              '  <meta name="twitter:description" content="A free Christian resource for biblical answers, prayer, Bible study, Christian articles, and Gospel-centered hope in Jesus Christ." />',
              '  <meta name="twitter:image" content="https://www.solomonforjesus.com/ChatGPT%20Image%20Jun%2027,%202026,%2011_30_33%20AM.png" />'
          ]
          new = "\n".join(lines)
          if old in s:
              s = s.replace(old, new, 1)
          marker = '<body>\n  <div class="page">'
          replacement = '<body>\n  <h1 style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;">Solomon For Jesus — Christian Answers, Prayer, Bible Study, and Hope in Jesus Christ</h1>\n  <div class="page">'
          if marker in s and 'Christian Answers, Prayer, Bible Study, and Hope in Jesus Christ</h1>' not in s:
              s = s.replace(marker, replacement, 1)
          p.write_text(s, encoding="utf-8")
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Improve Solomon homepage SEO metadata"
          git push
