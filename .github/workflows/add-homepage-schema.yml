name: Add Homepage Schema

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-homepage-schema.yml

permissions:
  contents: write

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add WebSite and Organization JSON-LD
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          marker = 'id="solomon-homepage-schema"'
          if marker not in s:
              data = {
                  "@context": "https://schema.org",
                  "@graph": [
                      {
                          "@type": "WebSite",
                          "@id": "https://www.solomonforjesus.com/#website",
                          "url": "https://www.solomonforjesus.com/",
                          "name": "Solomon For Jesus",
                          "description": "A free Christian resource offering biblical answers, prayer support, Bible study, Christian articles, and Gospel-centered hope in Jesus Christ."
                      },
                      {
                          "@type": "Organization",
                          "@id": "https://www.solomonforjesus.com/#organization",
                          "name": "Solomon For Jesus",
                          "url": "https://www.solomonforjesus.com/"
                      }
                  ]
              }
              tag = '<script id="solomon-homepage-schema" type="application/ld+json">' + json.dumps(data, separators=(",", ":")) + '</script>\n'
              s = s.replace('</head>', '  ' + tag + '</head>', 1)
              p.write_text(s, encoding="utf-8")
          PY
      - name: Commit schema
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add homepage structured data"
          git push
